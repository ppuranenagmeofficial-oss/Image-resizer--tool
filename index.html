<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer</title><style>body{font-family:sans-serif;text-align:center;background:#f2f2f2;padding:15px}.box{background:#fff;padding:20px;border-radius:15px;max-width:400px;margin:auto}button{background:#00b894;color:#fff;padding:12px;border:none;border-radius:8px;width:100%}input{padding:10px;width:90%;margin:10px;border-radius:8px;border:1px solid #ccc}img{max-width:100%;margin-top:10px}</style></head><body><div class="box"><h3>Image Resizer - Free Tool</h3><input type="file" id="file" accept="image/*"><input type="number" id="w" placeholder="Width 300"><input type="number" id="h" placeholder="Height 300"><button onclick="doResize()">Resize & Download</button><canvas id="c" style="display:none"></canvas><img id="p"></div><script>let im=new Image(),a=document.getElementById('file'),b=document.getElementById('p'),c=document.getElementById('c');a.addEventListener('change',e=>{let r=new FileReader();r.onload=x=>{im.src=x.target.result;b.src=x.target.result};r.readAsDataURL(e.target.files[0])});function doResize(){let W=document.getElementById('w').value,H=document.getElementById('h').value;c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);let d=document.createElement('a');d.download='resized.png';d.href=c.toDataURL();d.click()}</script></body></html>
